# V1 partial-observation, non-RIS JEPA world-model defaults
seed: 42
representation:
  latent_dim: 128
  strategy: multi-block
  mask_ratio: 0.5
  mask_ratio_start: 0.25
  mask_curriculum_epochs: 0
  epochs: 100
  batch_size: 64
  lr: 0.00003
  ema_start: 0.9999
  ema_end: 0.9999
  patience: 30
  min_delta: 0.0001
  val_repeats: 8
  warmup_epochs: 3
  final_lr_ratio: 0.1
  grad_clip: 1.0
  predictor_variant: original
  feature_loss: normalized
  sparse_context: true
  freeze_bn: false
  freeze_bn_affine: false
  min_feature_std: 0.0001
  mask_ratio_ablation: 0.25
  antenna_ratios: [0.25]
vae:
  latent_dim: 128
  beta: 0.001
  epochs: 100
world_model:
  latent_dim: 160
  hidden_dim: 256
  mixtures: 5
  epochs: 50
  sequence_length: 100
controller:
  action_dim: 2
  input_dim: 416
  actor_hidden: 128
  episodes: 500
  episode_length: 5000
  rollout_steps: 512
  minibatch_size: 256
  ppo_epochs: 4
  actor_lr: 0.0001
  critic_lr: 0.0005
  value_clip: 0.2
  entropy_coef_start: 0.01
  entropy_coef_end: 0.0
  entropy_anneal_fraction: 0.30
  target_kl: 0.015
  eval_interval: 25
  eval_episodes: 3
  initial_log_std: 0.7
  max_log_std: 0.7
environment:
  pilot_samples: 256
  num_antennas: 4
  tap_delays: [0, 2, 5]
  tap_power_db: [0.0, -4.0, -8.0]
  fading_correlation: 0.95
  trajectory: static
  max_steps: 5000
artifacts_root: artifacts/jepa_wm_v1
